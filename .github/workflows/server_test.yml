name: Test Multiple Errors

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Echo message
        run: echo "Starting build..."

      - name: Check Python version
        run: python3 --version

      - name: Run tests
        run: python -m pytest tests/

      - name: Download dependencies
        run: |
          curl -o package.tar.gz https://unavailable-server-12345.example.com/package.tar.gz || echo "Failed to download package.tar.gz"
          tar -xzf package.tar.gz || echo "Failed to extract package.tar.gz"

      - name: Use environment variable
        run: echo "Token is ${{ env.GITHUB_TOKEN }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
