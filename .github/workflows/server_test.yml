name: Test Multiple Errors

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Echo message
        run: echo "Starting build..."

      - name: Check Python version
        run: python3 --version

      - name: Run tests
        run: python -m pytest tests/

      - name: Download dependencies
        run: |
          curl -o package.tar.gz https://unavailable-server-12345.example.com/package.tar.gz || echo "Failed to download package.tar.gz"
          tar -xzf package.tar.gz || echo "Failed to extract package.tar.gz"

      - name: Use environment variable
        run: echo "Token is ${{ secrets.GITHUB_TOKEN }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
