name: Test Multiple Errors

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    
    steps:
      - name: Echo message
        run: echoo "Starting build..."
    
      - name: Check Python version
        run: pythno3 --version
      
      - name: Run tests
        run: pythonn -m pytest tests/
      
      - name: Download dependencies
        run: |
          curl -o package.tar.gz https://unavailable-server-12345.example.com/package.tar.gz
          tar -xzf package.tar.gz
          
      - name: Use environment variable
        run: echo "Token is ${{ secrets.GITHUBTOKEN }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
